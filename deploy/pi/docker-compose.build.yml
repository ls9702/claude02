# Pi 에서 **직접 빌드**할 때 겹쳐 쓰는 오버레이 (선택).
#
# 기본 docker-compose.yml 은 `image:` 만 쓴다 — PC 에서 build-arm64.sh 로 만든 이미지를
# `docker load` 로 넣는 것을 전제로 하기 때문이다. Pi 의 RAM 이 4GB 이상이면 Pi 에서
# 그냥 빌드하는 편이 간단하다 (약 10~20분. 2GB 면 PC 크로스 빌드를 권한다 —
# better-sqlite3 컴파일에서 메모리가 모자랄 수 있다).
#
#   git clone <저장소> ~/whiteboard && cd ~/whiteboard/deploy/pi
#   cp .env.example .env && vi .env
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#   docker compose up -d          # 빌드 결과가 whiteboard-app:latest 로 찍혀 있으므로 오버레이 없이 뜬다
#
# 코드를 고친 뒤 다시 빌드할 때도 같은 두 줄이면 된다 (OPERATIONS.md 4장 Pi 분기).
#
# 빌드 컨텍스트는 **저장소 루트**다 (Dockerfile 이 workspace 전체를 필요로 한다).
# .env 의 APP_TAG/ROOM_TAG 는 latest 로 두어야 여기서 만든 이미지를 그대로 쓴다.

services:
  app:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: whiteboard-app:${APP_TAG:-latest}

  room:
    build:
      context: ../..
      dockerfile: room/Dockerfile
    image: whiteboard-room:${ROOM_TAG:-latest}
