# 라즈베리파이4 배포용 compose (deploy/pi).
#
# NAS(DS118)용 저장소 루트의 docker-compose.yml 과 달리, Pi 에는 DSM 리버스 프록시가
# 없으므로 **Caddy 컨테이너**가 그 자리를 대신한다. TLS 발급·갱신(Let's Encrypt)과
# WebSocket 통과를 Caddy 가 맡는다.
#
#   [브라우저] → 443 → [caddy] → app:3001 → room:3002
#
# app·room 은 호스트에 포트를 열지 않는다(`expose` 만). 외부에서 보이는 포트는
# Caddy 의 80/443 뿐이다 — 공유기에서 3001/3002 를 여는 일이 없도록 구조로 막는다.
#
# 실행:
#   cp .env.example .env && vi .env      # 값 채우기 (SETUP-PI.md 5단계)
#   docker compose up -d                 # A안 (Caddy 가 443 을 받는다)
#   docker compose --profile tunnel up -d  # B안 (Cloudflare Tunnel 추가)
#
# 이미지는 PC 에서 `build-arm64.sh` 로 만들어 `docker load` 하거나(4단계),
# Pi 에서 직접 빌드한다:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#
# A안/B안 전환은 `.env` 의 SITE_ADDRESS·TRUST_PROXY 두 줄이 전부다 (SETUP-PI.md 6단계).

name: whiteboard

services:
  # ---- 리버스 프록시 -------------------------------------------------------
  # Caddy 는 Caddyfile 의 사이트 주소가 도메인이면 자동으로 Let's Encrypt 인증서를
  # 발급·갱신하고 80 → 443 리다이렉트까지 붙인다. WebSocket 은 별도 설정 없이 통과한다.
  caddy:
    image: caddy:2-alpine
    container_name: whiteboard-caddy
    restart: unless-stopped
    ports:
      # 이 컨테이너만 호스트 포트를 잡는다. 공유기 포트포워딩도 이 둘만 Pi 로 보낸다.
      - "80:80"
      - "443:443"
      # HTTP/3(QUIC). 공유기에서 UDP 443 을 열지 않았으면 그냥 쓰이지 않는다(무해).
      - "443:443/udp"
    environment:
      # Caddyfile 안에서 {$SITE_ADDRESS} 등으로 치환된다.
      #   A안: draw.863ad.co.kr  (자동 HTTPS)
      #   B안: :80               (cloudflared 가 TLS 를 종단하므로 Caddy 는 평문 80 만)
      SITE_ADDRESS: ${SITE_ADDRESS:-draw.863ad.co.kr}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@863ad.co.kr}
      # A안에서 NAS 호스트명을 NAS 로 되돌려 줄 때 쓴다 (Caddyfile 의 주석 블록 참고).
      NAS_IP: ${NAS_IP:-192.168.1.100}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서와 ACME 계정 키가 여기 쌓인다.
      # **지우면 안 된다** — 지우면 재발급을 하게 되고 Let's Encrypt 발급 한도에 걸릴 수 있다.
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - app
    mem_limit: 128m
    mem_reservation: 32m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  # ---- 앱 ------------------------------------------------------------------
  app:
    image: whiteboard-app:${APP_TAG:-latest}
    container_name: whiteboard-app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # 이미지에 이미 들어 있는 값이지만, 컨테이너를 보고 바로 알 수 있게 다시 적는다.
      # (여기 적은 값이 env_file 보다 우선한다 — .env 에서 바꾸면 안 되는 값들이다.)
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      DATA_DIR: /data
      FRONTEND_DIST: /app/frontend/dist
      # 릴레이는 내부 네트워크 이름으로만 부른다 (호스트에 열지 않는다).
      ROOM_URL: http://room:3002
      # V8 힙 상한 — 컨테이너 한도(mem_limit)보다 낮게 잡아, cgroup 이 프로세스를
      # 죽이기 전에 GC 가 먼저 돌게 한다. 근거는 README/보고서의 메모리 측정표.
      NODE_OPTIONS: --max-old-space-size=256
    expose:
      # ports 가 아니라 expose — 호스트에는 열리지 않고 Caddy 만 이 포트를 본다.
      - "3001"
    volumes:
      # SQLite(app.db) · 업로드 파일(files/) · 백업(backup/) 이 모두 여기 쌓인다.
      # 호스트 쪽 디렉터리는 uid 1000 이 쓸 수 있어야 한다 (SETUP-PI.md 5단계).
      # microSD 마모가 걱정되면 이 경로를 USB SSD 로 옮긴다 (SETUP-PI.md 10단계).
      - ${DATA_DIR_HOST:-./data}:/data
    depends_on:
      - room
    mem_limit: 384m
    mem_reservation: 192m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  # ---- 협업 릴레이 ---------------------------------------------------------
  room:
    image: whiteboard-room:${ROOM_TAG:-latest}
    container_name: whiteboard-room
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=96
    # ports 없음 — 브라우저는 app 의 /socket.io 프록시를 거쳐서만 붙는다.
    # 그 경계에서 세션 쿠키 인증을 검사한다 (backend/src/collab/proxy.ts).
    expose:
      - "3002"
    mem_limit: 144m
    mem_reservation: 96m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  # ---- B안: Cloudflare Tunnel ---------------------------------------------
  # `--profile tunnel` 을 붙였을 때만 뜬다. 공유기 포트포워딩·인증서가 필요 없다.
  #   docker compose --profile tunnel up -d
  #
  # Cloudflare Zero Trust 대시보드에서 터널을 만들고 Public Hostname 을
  #   draw.863ad.co.kr  →  Service: HTTP  →  URL: caddy:80
  # 로 지정한 뒤, 발급된 토큰을 .env 의 CLOUDFLARE_TUNNEL_TOKEN 에 넣는다.
  # (Caddy 를 거치므로 .env 는 SITE_ADDRESS=:80 · TRUST_PROXY=2 여야 한다 — SETUP-PI.md 6단계 B안)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: whiteboard-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    mem_limit: 128m
    mem_reservation: 32m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
